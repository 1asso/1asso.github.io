# The apps, one entry each. The home page (each app's room) and the footer
# read from here, and the privacy page can too, so a fact changed here changes
# everywhere it's shown. The order here is the order of the rooms on the home page
# and of the footer's app links.
# Every room shows its app's icon, so every entry needs icon and icon_alt as well as its name, pitch,
# url and colors (see README.md, "Add an app later").
#
# Fields
#   name, subtitle      the App Store name is "name: subtitle" (subtitle is a note only; the site doesn't read it)
#   gloss               optional line over the pitch in the app's room (raw HTML allowed)
#   status              a note only: available, coming or development (with status_label's words, "Coming
#                       soon" or "In development", for the last two). No page shows it: the room's App Store
#                       badge says it, linked once the app is out (store, below)
#   pitch               one short sentence beside the name in the app's room, about as long as the others'
#   store               the App Store url. With a url, the room shows the App Store badge; with an
#                       empty url (an app not out yet), the badge without a link; without the block, none.
#   color, color_dark   the app's color for its bits on the page's canvas (in its part of the privacy page),
#                       written into every page by _includes/head.html; at least 3:1 on #F8F9FA (light) and
#                       #121315 (dark). Bits and marks only, never text; in the app's own room its bits are the
#                       room's ink
#   room, room_dark     the ground of the app's room on the home page, painted edge to edge, in light and
#                       dark mode (head.html writes it as --<key>-room): its columns rise in this color, and its
#                       part of the privacy page opens on a band of it.
#   room_text           light (white text) or dark (ink text) on that ground. Every text in the room is that
#                       ink at 84% or more (92% on an ink room at night), which must hold 4.5:1 on both grounds:
#                       white needs a deep ground (Lark's color gives it 4.0:1, so its room is a deeper teal),
#                       and ink a light one (Kozeni's coral is deeper at night, about as Michi's and Lark's are,
#                       and its ink there is at 92% or more, site.css)
#   icon                file prefix in /assets/images/icons/: <icon>-light-<size>.webp, <icon>-dark-<size>.webp
#   icon_alt            the icon's alt text wherever the icon is the subject
#   url                 the app's room on the home page (/#key); the footer links here
#   privacy             a note only: the app's section of /privacy/, the address to give App Store
#                       Connect (with https://tinybit.studio in front). The site doesn't read it, but
#                       the id after # must match a section id on that page, so keep both stable.
#   exhibit             the include in _includes/exhibits/ that holds the app's piece to try; leave it out for none

michi:
  name: Michi
  subtitle: Trips & Itineraries
  gloss: '<span lang="ja">道</span>, Japanese for road'
  status: available
  pitch: Plan a trip with the people you’re going&nbsp;with.
  store:
    url: https://apps.apple.com/us/app/michi-trips-itineraries/id6819084940
  color: "#2F4FA2"
  color_dark: "#5A78C8"
  room: "#2F4FA2"
  room_dark: "#24408C"
  room_text: light
  icon: michi
  icon_alt: "The Michi app icon: a white postage stamp printed with a coast, a cape and an island in a sea of layered blues, a gull flying across its top and out past its edge."
  url: /#michi
  privacy: /privacy/#michi
  exhibit: michi

lark:
  name: Lark
  subtitle: Language Shadowing
  status: available
  pitch: Practice speaking a language by&nbsp;shadowing real&nbsp;material.
  store:
    url: https://apps.apple.com/us/app/lark-language-shadowing/id6817513150
  color: "#3E8995"
  color_dark: "#36A9B5"
  room: "#276A73"
  room_dark: "#1F5961"
  room_text: light
  icon: lark
  icon_alt: "The Lark app icon: a black lark singing, its head thrown back and its gold beak open."
  url: /#lark
  privacy: /privacy/#lark
  exhibit: lark

kozeni:
  name: Kozeni
  subtitle: Spending & Budgets
  gloss: '<span lang="ja">小銭</span>, Japanese for small&nbsp;change'
  status: available
  pitch: Track what you spend and keep a&nbsp;budget,&nbsp;privately.
  store:
    url: https://apps.apple.com/us/app/kozeni-spending-budgets/id6760676910
  color: "#EF5F31"
  color_dark: "#FF7A47"
  room: "#EF5F31"
  room_dark: "#D9542B"
  room_text: dark
  icon: kozeni
  icon_alt: "The Kozeni app icon: a coral coin with a square hole, tied on a twisted rope."
  url: /#kozeni
  privacy: /privacy/#kozeni
  exhibit: kozeni
