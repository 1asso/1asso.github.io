# The apps, one entry each. The home page (each app's room) and the footer
# read from here, and the privacy page can too, so a fact changed here changes
# everywhere it's shown. The order here is the order of the footer's app links.
# An app in development can have a brief room (see README.md): it needs only name, status,
# status_label, pitch, url and the color notes (gloss is optional).
#
# Fields
#   name, subtitle      the App Store name is "name: subtitle" (subtitle is a note only; the site doesn't read it)
#   gloss               optional line under the name in the home page room (raw HTML allowed)
#   status              available (filled bit), or coming or development (hollow bit); status_label is the words
#   pitch               one or two sentences, shown under the name in the app's room
#   store               the App Store url (leave the block out for an app that isn't out yet).
#                       With a url, the room shows the App Store badge. With an empty url (an app
#                       in App Review), it shows the badge without a link.
#   color, color_dark   a note only: the app's own color. The site's colors are set in
#                       assets/css/site.css (--kozeni, --lark, --michi), used for bits and status marks, never text
#   icon                file prefix in /assets/images/icons/: <icon>-light-<size>.webp, <icon>-dark-<size>.webp
#   icon_alt            the icon's alt text wherever the icon is the subject
#   url                 the app's room on the home page (/#key); the footer links here
#   privacy             a note only: the app's section of /privacy/, the address to give App Store
#                       Connect (with https://tinybit.studio in front). The site doesn't read it, but
#                       the id after # must match a section id on that page, so keep both stable.
#   label               the museum label beside the plinth; icon_light and icon_dark describe the icon
#                       as it looks in each color scheme
#   points              four run-in feature points in the app's room (title ends with a full stop)

lark:
  name: Lark
  subtitle: Language practice
  status: coming
  status_label: Coming soon
  pitch: Practice speaking a language by shadowing real&nbsp;material.
  store:
    url:   # in App Review; paste the App Store link here once Lark is out
  color: "#3E8995"
  color_dark: "#36A9B5"
  icon: lark
  icon_alt: "The Lark app icon: a black lark singing, its head thrown back and its gold beak open."
  url: /#lark
  privacy: /privacy/#lark
  label:
    title: Lark
    medium: SwiftUI, for iPhone and iPad
    icon_light: A black lark singing, gold beak, white ground
    icon_dark: A white lark singing, gold beak, black ground
    credit: Free, with an optional tip jar
  points:
    - title: Real material.
      text: Podcasts, with search built in. YouTube videos, where YouTube allows. Your own videos from Photos, and video or audio files from&nbsp;Files.
    - title: Hear the difference.
      text: Turn on Record Attempts and Lark plays each try back to you, just before the original plays&nbsp;again.
    - title: Ask what it means.
      text: With Apple Intelligence, tap the bubble beside a sentence for its meaning and a note or two, written on your&nbsp;device.
    - title: What syncs.
      text: iCloud syncs your cards, progress and practice days. Media files, transcripts and recordings stay on the&nbsp;device.

kozeni:
  name: Kozeni
  subtitle: Spending & Budgets
  gloss: '<span lang="ja">小銭</span>, Japanese for small change'
  status: available
  status_label: On the App Store
  pitch: A private expense and income tracker. Log what you spend, see where it goes, and keep a budget. No subscription, no account, no&nbsp;ads.
  store:
    url: https://apps.apple.com/us/app/kozeni-spending-budgets/id6760676910
  color: "#EF5F31"
  color_dark: "#FF7A47"
  icon: kozeni
  icon_alt: "The Kozeni app icon: a coral coin with a square hole, tied on a twisted rope."
  url: /#kozeni
  privacy: /privacy/#kozeni
  label:
    title: "Kozeni: Spending & Budgets"
    medium: SwiftUI, for iPhone and iPad
    icon_light: Square-holed coral coin on a twisted black rope, white ground
    icon_dark: Square-holed coral coin on a twisted white rope, black ground
    credit: Free, with an optional tip jar
  points:
    - title: Log an entry in a few taps.
      text: A clean keypad, a category, and a note if you want. Recurring entries add themselves when you open Kozeni on the day they’re&nbsp;due.
    - title: See where it goes.
      text: Charts by week, month or year. Tap a point or a category to reach the entries behind&nbsp;it.
    - title: Keep a budget.
      text: Weekly, monthly or yearly, for one category or for everything, with what’s used and what’s&nbsp;left.
    - title: Private by default.
      text: Your data stays on your devices and syncs through your own iCloud. There’s no server of ours to send it&nbsp;to.

michi:
  name: Michi
  gloss: '<span lang="ja">道</span>, Japanese for road'
  status: development
  status_label: In development
  pitch: Plan a trip with the people you’re going&nbsp;with.
  color: "#3D5FE8"
  color_dark: "#5278FB"
  icon: michi
  icon_alt: "The Michi app icon: a cobalt postage stamp printed with a winding road, cancelled by a postmark."
  url: /#michi
  label:
    title: Michi
    medium: SwiftUI, for iPhone and iPad
    icon_light: A cobalt stamp printed with a road, black postmark, white ground
    icon_dark: A cobalt stamp printed with a road, white postmark, black ground
    credit: A work in progress
  points:
    - title: A stamp for every trip.
      text: Each trip is a stamp in your album, printed in its own ink and postmarked when the trip is&nbsp;over.
    - title: The plan, as a brochure.
      text: Open a stamp to see the trip day by day, its stops on a map with the route between&nbsp;them.
    - title: Plan it together.
      text: Invite the people you’re going with and edit the same plan. It’s shared through iCloud, with no server of ours in&nbsp;between.
    - title: Photos where they happened.
      text: Once you’ve been to a stop, add your photos to it, and everyone on the trip sees them&nbsp;there.
