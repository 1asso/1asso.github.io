{%- comment -%}
  Site header: the mark and wordmark (home), then Apps, Studio and Contact, the home page's sections.
  The same on every page.
{%- endcomment -%}
<header class="site-head wrap">
  <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.title }}, home">
    {%- include mark.html class="brand__mark" -%}
    <span class="brand__name">{{ site.title }}</span>
  </a>
  <nav class="site-nav" aria-label="Main">
    <ul role="list">
      <li><a href="{{ '/#apps' | relative_url }}">Apps</a></li>
      <li><a href="{{ '/#studio' | relative_url }}">Studio</a></li>
      <li><a href="{{ '/#contact' | relative_url }}">Contact</a></li>
    </ul>
  </nav>
</header>
